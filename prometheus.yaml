# prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "jenkins_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

scrape_configs:
  # Jenkins monitoring
  - job_name: 'jenkins'
    static_configs:
      - targets: ['jenkins:8080']
    metrics_path: '/prometheus'
    scrape_interval: 30s
    scrape_timeout: 10s

  # SonarQube monitoring
  - job_name: 'sonarqube'
    static_configs:
      - targets: ['sonarqube:9000']
    metrics_path: '/api/monitoring/metrics'
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Application monitoring (when deployed)
  - job_name: 'spring-petclinic'
    static_configs:
      - targets: ['192.168.1.100:8080']  # Production server
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s
    scrape_timeout: 10s